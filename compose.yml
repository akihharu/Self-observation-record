services:
  db:
    image: postgres:17
    container_name: self-observation-record-db
    environment:
      POSTGRES_DB: self_observation_record
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    user: "1000:1000"
    image: node:24-bookworm
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
volumes:
  postgres_data: